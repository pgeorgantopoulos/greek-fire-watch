name: Daily fire report

on:
  schedule:
    # 06:00 UTC ≈ 09:00 Europe/Athens (08:00 in winter) — adjust as needed.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily report
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python -m src.main

      - name: Commit and push report + site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports docs
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily fire report $(date -u +%Y-%m-%d)"
          git push
